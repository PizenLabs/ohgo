name: release

# CD only. The portable artifacts are cross-compiled on ubuntu-latest. The
# multi-language artifacts compile C grammars, so they are built on a native
# runner for each platform (darwin on macOS, linux/arm64 with the cross
# toolchain); cgo has no portable cross-compiler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.0.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed by the release being published, not by github.ref: a manual dispatch
  # runs on a branch ref, so keying by ref would serialise unrelated tags.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release tree
    # Only a stable tag publishes itself. A suffixed tag (v0.1.2-beta) is a
    # prerelease, and pushing one must not create a release; it is published on
    # purpose with workflow_dispatch, which keeps the prerelease flag below
    # meaningful. The trigger filter cannot express this exclusion, so the gate
    # lives here, where every downstream job inherits it through `needs`.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag, version files, formatting, and tests
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          test "v$(cat VERSION)" = "${VERSION}"
          test -z "$(gofmt -l .)"
          ./scripts/update-version.sh --check
          go build ./...
          # The release is the last place a regression is cheap to stop: CI
          # gated main, but the tag may point somewhere CI never saw.
          go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep this list aligned with Target.Supported in
        # internal/update/release.go: the updater only self-updates platforms
        # that the release actually publishes.
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/release-target.sh
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ohgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ohgo-*.tar.gz
          if-no-files-found: error

  build-multilang:
    name: build multilang ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # cgo needs a native target compiler. The darwin entries cross-build
        # between the two macOS architectures with the universal SDK; the
        # linux arm64 entry uses the distro cross toolchain.
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
          - goos: darwin
            goarch: amd64
            runner: macos-14
          - goos: darwin
            goarch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the linux arm64 cross compiler
        if: matrix.cc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc || 'cc' }}
          VARIANT: multilang
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/release-target.sh
      - name: Verify the artifact sees non-Go adapters
        run: |
          set -eu
          dir=$(mktemp -d)
          tar -xzf dist/ohgo-*-multilang.tar.gz -C "$dir"
          binary=$(find "$dir" -type f -name ohgo | head -n 1)
          # Doctor exits non-zero when unrelated checks fail on a bare runner;
          # the adapter row is the fact this job must prove before publishing.
          "$binary" doctor 2>&1 | grep -q "tree-sitter-typescript"
          "$binary" version
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ohgo-${{ matrix.goos }}-${{ matrix.goarch }}-multilang
          path: dist/ohgo-*-multilang.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, build-multilang]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum *.tar.gz > sha256sums.txt
          cat sha256sums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A suffixed tag is a prerelease. Publishing it as stable would make
          # /releases/latest point at a build the updater refuses to install, so
          # install.sh would resolve to something ohgo itself rejects.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
