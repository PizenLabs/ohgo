name: ci

# CI only. Release building lives in release.yml and runs exclusively from tags
# (or an explicit workflow_dispatch), so a push to main never pays for artifacts
# or a cross-compilation matrix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test, vet, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The action injects the `run` subcommand itself; `args` must be the
          # flags/packages only. Passing `run ./...` here yields
          # `golangci-lint run run ./...`, which treats `run` as a package path.
          args: ./...
