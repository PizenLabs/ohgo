name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Installer fixtures
        run: bash scripts/install_test.sh
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          use_oidc: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The action injects the `run` subcommand itself; `args` must be the
          # flags/packages only. Passing `run ./...` here yields
          # `golangci-lint run run ./...`, which treats `run` as a package path.
          args: ./...
