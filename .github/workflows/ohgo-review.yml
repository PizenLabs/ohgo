name: ohgo On-Demand Reviewer

# Triggered by a `/ohgo review` comment on a pull request.
#
# Security contract: this workflow runs with repository secrets and write
# permissions while its input is attacker-controlled (the PR diff). The code it
# executes must therefore always come from the default branch, never from the PR
# head. The PR head is fetched purely as *data* to diff against and is never
# checked out, so a fork cannot modify `.github/scripts/review.py` and have it
# run with `GEMINI_API_KEY` and the bot token in the environment.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ohgo-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only a PR comment from someone with write access may spend the API quota
    # and post as the bot. Without the association gate any drive-by commenter
    # could trigger reviews. Closed PRs are skipped because their
    # `refs/pull/<n>/head` ref no longer exists to diff against.
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '/ohgo review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only the checkout needs GITHUB_TOKEN. Writes must come from the
      # ohgo-agent PAT so the review is authored by that account; granting
      # `issues`/`pull-requests` write here would only make it possible to post
      # as github-actions[bot]. Keep those grants off the workflow token.
      contents: read
    env:
      # The sole write identity. There is deliberately no fallback to
      # `github.token`: a review posted as github-actions[bot] is misattributed,
      # so a missing or under-scoped PAT fails the job instead of silently
      # changing who authored the review.
      GH_TOKEN: ${{ secrets.OHGO_GITHUB_TOKEN }}
    steps:
      - name: Acknowledge command
        uses: actions/github-script@v9
        with:
          # Keep the client valid even when the secret is unset; the script
          # below refuses to write in that case, so the fallback token is never
          # used to author a review.
          github-token: ${{ env.GH_TOKEN || github.token }}
          script: |
            // The reaction doubles as the permission probe: creating it needs
            // the same `Issues: read and write` / `Pull requests: read and
            // write` grants as posting the review. Failing here keeps a
            // mis-scoped token from spending API quota and from being papered
            // over by a github-actions[bot] comment.
            if (!process.env.GH_TOKEN) {
              core.setFailed(
                'OHGO_GITHUB_TOKEN is not configured. Add the ohgo-agent ' +
                'fine-grained PAT as a repository secret; refusing to post as ' +
                'github-actions[bot].'
              );
              return;
            }
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } catch (error) {
              core.setFailed(
                `OHGO_GITHUB_TOKEN cannot write to this pull request ` +
                `(${error.status}: ${error.message}). Grant the ohgo-agent ` +
                'token "Issues: Read and write" and "Pull requests: Read and ' +
                'write"; refusing to post as github-actions[bot].'
              );
            }

      - name: Checkout trusted reviewer
        # No `ref`: the default-branch checkout is the point. See the contract
        # comment at the top of this file. Credentials stay persisted because
        # the next step fetches the PR head from the same origin; the job token
        # is `contents: read`, so it cannot push.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract PR diff
        # SHAs are hex, but they still reach the shell through env rather than
        # through `${{ }}` interpolation so no expression value is ever parsed
        # as shell syntax.
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git merge-base "origin/${BASE_REF}" origin/pr-head
          git diff --no-color "origin/${BASE_REF}...origin/pr-head" > pr.diff
          wc -l pr.diff

      - name: Generate review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # A missing key is a configuration error, not a quota event: fail loudly
        # instead of posting an "offline mode" table on every PR.
        run: |
          set -eu
          test -n "${GEMINI_API_KEY:-}" || {
            echo "GEMINI_API_KEY is not configured for this repository." >&2
            exit 1
          }
          python3 .github/scripts/review.py pr.diff > review_comment.md

      - name: Post comment as ohgo
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.GH_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review_comment.md', 'utf8').trim();
            if (!body) {
              core.warning('Reviewer produced an empty comment; skipping post.');
              return;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            };
            try {
              await github.rest.issues.createComment(params);
            } catch (error) {
              // The acknowledgement already proved the token can write, so this
              // is a genuine failure (network, throttling, revoked token). Fail
              // rather than retrying as github-actions[bot].
              core.setFailed(
                `OHGO_GITHUB_TOKEN cannot post comments ` +
                `(${error.status}: ${error.message}); refusing to post as ` +
                'github-actions[bot].'
              );
            }
