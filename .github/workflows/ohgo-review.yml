name: ohgo On-Demand Reviewer

# Triggered by a `/ohgo review` comment on a pull request.
#
# Security contract: this workflow runs with repository secrets and write
# permissions while its input is attacker-controlled (the PR diff). The code it
# executes must therefore always come from the default branch, never from the PR
# head. The PR head is fetched purely as *data* to diff against and is never
# checked out, so a fork cannot modify `.github/scripts/review.py` and have it
# run with `GEMINI_API_KEY` and the bot token in the environment.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ohgo-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only a PR comment from someone with write access may spend the API quota
    # and post as the bot. Without the association gate any drive-by commenter
    # could trigger reviews. Closed PRs are skipped because their
    # `refs/pull/<n>/head` ref no longer exists to diff against.
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '/ohgo review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `issues: write` alone is not enough for PR threads. GitHub checks
      # `pull-requests: write` for comments and reactions on a pull request even
      # though the reaction endpoint advertises `issues=write`; without this
      # grant the workflow token fails with `Resource not accessible by
      # integration` on every write.
      issues: write
      pull-requests: write
    env:
      # Prefer the bot identity when configured; fall back to the workflow token
      # so the reviewer still works before the PAT exists. The bot token is a
      # *preference*, not a requirement: a fine-grained PAT without `Issues:
      # write` / `Pull requests: write` returns 403 on every write call, so each
      # write below retries with WORKFLOW_TOKEN, which always carries the
      # `issues: write` and `pull-requests: write` grants declared for this job.
      # A mis-scoped PAT must never discard a finished review.
      GH_TOKEN: ${{ secrets.OHGO_GITHUB_TOKEN || github.token }}
      WORKFLOW_TOKEN: ${{ github.token }}
    steps:
      - name: Acknowledge command
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            };
            // Acknowledgement is cosmetic. Fall back to the workflow token on a
            // permission error, and warn rather than abort the review if even
            // that fails: the API quota should be spent on the review itself.
            try {
              try {
                await github.rest.reactions.createForIssueComment(params);
              } catch (error) {
                if ((error.status !== 403 && error.status !== 404) ||
                    process.env.GH_TOKEN === process.env.WORKFLOW_TOKEN) {
                  throw error;
                }
                core.warning(`Bot token cannot react to the comment (${error.status}); retrying with the workflow token.`);
                await getOctokit(process.env.WORKFLOW_TOKEN)
                  .rest.reactions.createForIssueComment(params);
              }
            } catch (error) {
              core.warning(`Could not add the eyes reaction: ${error.message}`);
            }

      - name: Checkout trusted reviewer
        # No `ref`: the default-branch checkout is the point. See the contract
        # comment at the top of this file. Credentials stay persisted because
        # the next step fetches the PR head from the same origin; the job token
        # is `contents: read`, so it cannot push.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract PR diff
        # SHAs are hex, but they still reach the shell through env rather than
        # through `${{ }}` interpolation so no expression value is ever parsed
        # as shell syntax.
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"
          git merge-base "origin/${BASE_REF}" origin/pr-head
          git diff --no-color "origin/${BASE_REF}...origin/pr-head" > pr.diff
          wc -l pr.diff

      - name: Generate review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # A missing key is a configuration error, not a quota event: fail loudly
        # instead of posting an "offline mode" table on every PR.
        run: |
          set -eu
          test -n "${GEMINI_API_KEY:-}" || {
            echo "GEMINI_API_KEY is not configured for this repository." >&2
            exit 1
          }
          python3 .github/scripts/review.py pr.diff > review_comment.md

      - name: Post comment as ohgo
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review_comment.md', 'utf8').trim();
            if (!body) {
              core.warning('Reviewer produced an empty comment; skipping post.');
              return;
            }
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            };
            try {
              await github.rest.issues.createComment(params);
            } catch (error) {
              // A review that already cost API quota must not be lost to a
              // token-scope problem. The workflow token can always write; the
              // only cost is losing the bot identity.
              if ((error.status !== 403 && error.status !== 404) ||
                  process.env.GH_TOKEN === process.env.WORKFLOW_TOKEN) {
                throw error;
              }
              core.warning(`Bot token cannot post comments (${error.status}); posting with the workflow token instead. Grant OHGO_GITHUB_TOKEN \`Issues: write\` and \`Pull requests: write\` to restore the ohgo identity.`);
              await getOctokit(process.env.WORKFLOW_TOKEN)
                .rest.issues.createComment(params);
            }
