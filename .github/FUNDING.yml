# Funding options for ohgo. GitHub only reads the keys listed here, so leave
# unused platforms commented out. Each active key must name an account that
# actually exists, otherwise GitHub renders a broken sponsor button.
github: [PizenLabs]
open_collective: pizenlabs
# patreon: # Replace with a single Patreon username
# ko_fi: # Replace with a single Ko-fi username
# tidelift: # Replace with a single Tidelift platform-name/package-name
# community_bridge: # Replace with a single Community Bridge project name
# liberapay: # Replace with a single Liberapay username
# issuehunt: # Replace with a single IssueHunt username
# lfx_crowdfunding: # Replace with a single LFX Crowdfunding project name
# polar: # Replace with a single Polar username
# buy_me_a_coffee: # Replace with a single Buy Me a Coffee username
# thanks_dev: # Replace with a single thanks.dev username
# custom: # Replace with up to 4 custom sponsorship URLs, one per line, e.g. ["https://example.com/donate"]
